---
apiVersion: v1
kind: Pod
metadata:
  name: netshoot-client
  labels:
    app: netshoot-client
spec:
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
          - key: kubernetes.io/hostname
            operator: In
            values:
            - k01-worker
  containers:
  - name: netshoot
    image: nicolaka/netshoot
    imagePullPolicy: IfNotPresent
    command:
    - /bin/sh
    - -c
    args:
    - "echo \"Netshoot Client pod started\"\necho \"IP: $(hostname -i)\"\necho \"\"\
      \necho \"=== MTU Lab Client ===\"\necho \"Use this pod to test MTU and connectivity.\"\
      \necho \"\"\n# Keep the pod running\nwhile true; do\n  sleep 3600\ndone\n"
