---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: cert-manager-demo
  labels:
    app: api
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: demo-apps
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
        app.kubernetes.io/name: api
        app.kubernetes.io/part-of: demo-apps
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: bgp-peer
                operator: DoesNotExist
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist
      containers:
      - name: nginx
        image: nginx:alpine
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
        volumeMounts:
        - name: html
          mountPath: /usr/share/nginx/html
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 50m
            memory: 32Mi
      volumes:
      - name: html
        configMap:
          name: api-html
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: cert-manager-demo
spec:
  selector:
    app: api
  ports:
  - port: 80
    targetPort: 80
