    \ <span class=\"value\">cert-manager.io/v1</span><br>\n            <span class=\"\
    key\">kind:</span> <span class=\"value\">Certificate</span><br>\n            <span\
    \ class=\"key\">metadata:</span><br>\n            &nbsp;&nbsp;<span class=\"key\"\
    >name:</span> <span class=\"value\">api-demo-lab</span><br>\n            <span\
    \ class=\"key\">spec:</span><br>\n            &nbsp;&nbsp;<span class=\"key\"\
    >dnsNames:</span><br>\n            &nbsp;&nbsp;&nbsp;&nbsp;- <span class=\"value\"\
    >api.demo.lab</span><br>\n            &nbsp;&nbsp;<span class=\"key\">issuerRef:</span><br>\n\
