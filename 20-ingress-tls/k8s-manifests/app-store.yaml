    \            max-width: 900px;\n            margin: 0 auto;\n            padding:\
    \ 60px 30px;\n            text-align: center;\n        }\n        \n        .lock-icon\
    \ {\n            width: 80px;\n            height: 80px;\n            margin:\
    \ 0 auto 30px;\n            background: linear-gradient(135deg, #4ade80, #22d3ee);\n\
    \            border-radius: 20px;\n            display: flex;\n            align-items:\
    \ center;\n            justify-content: center;\n            font-size: 40px;\n\
    \            box-shadow: 0 10px 40px rgba(74, 222, 128, 0.3);\n            animation:\
    \ float 3s ease-in-out infinite;\n        }\n        \n        @keyframes float\
    \ {\n            0%, 100% { transform: translateY(0); }\n            50% { transform:\
    \ translateY(-10px); }\n        }\n        \n        h1 {\n            font-size:\
    \ 3.5rem;\n            font-weight: 700;\n            margin-bottom: 15px;\n \
    \           background: linear-gradient(90deg, #fff, #a78bfa);\n            -webkit-background-clip:\
