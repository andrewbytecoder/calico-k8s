    \            color: #a5a5c0;\n            margin-bottom: 40px;\n            font-weight:\
    \ 300;\n        }\n        \n        .cert-badge {\n            display: inline-flex;\n\
    \            align-items: center;\n            gap: 12px;\n            background:\
    \ rgba(74, 222, 128, 0.15);\n            border: 1px solid rgba(74, 222, 128,\
    \ 0.3);\n            padding: 15px 30px;\n            border-radius: 50px;\n \
    \           margin-bottom: 50px;\n        }\n        \n        .cert-badge .icon\
    \ { font-size: 24px; }\n        .cert-badge .text { font-weight: 600; color: #4ade80;\
    \ }\n        .cert-badge .subtext { font-size: 0.85rem; color: #86efac; }\n  \
    \      \n        .info-grid {\n            display: grid;\n            grid-template-columns:\
    \ repeat(auto-fit, minmax(250px, 1fr));\n            gap: 25px;\n            margin-bottom:\
    \ 50px;\n        }\n        \n        .info-card {\n            background: rgba(255,255,255,0.05);\n\
    \            border: 1px solid rgba(255,255,255,0.1);\n            border-radius:\
    \ 16px;\n            padding: 30px;\n            backdrop-filter: blur(10px);\n\
    \            transition: transform 0.3s, box-shadow 0.3s;\n        }\n       \
    \ \n        .info-card:hover {\n            transform: translateY(-5px);\n   \
    \         box-shadow: 0 20px 40px rgba(0,0,0,0.3);\n        }\n        \n    \
    \    .info-card .label {\n            font-size: 0.8rem;\n            text-transform:\
    \ uppercase;\n            letter-spacing: 2px;\n            color: #8b8ba7;\n\
    \            margin-bottom: 10px;\n        }\n        \n        .info-card .value\
    \ {\n            font-size: 1.1rem;\n            color: #fff;\n            font-family:\
    \ 'Monaco', 'Consolas', monospace;\n            word-break: break-all;\n     \
    \   }\n        \n        .wildcard-highlight {\n            background: linear-gradient(90deg,\
