    \ border-box; }\n        \n        body { \n            font-family: 'Outfit',\
    \ sans-serif;\n            min-height: 100vh;\n            background: linear-gradient(135deg,\
    \ #0f0f23 0%, #1a1a3e 50%, #2d1b4e 100%);\n            color: #e8e8f0;\n     \
    \       overflow-x: hidden;\n        }\n        \n        .background-pattern\
    \ {\n            position: fixed;\n            top: 0;\n            left: 0;\n\
    \            width: 100%;\n            height: 100%;\n            background-image:\
    \ \n                radial-gradient(circle at 20% 80%, rgba(120, 80, 220, 0.15)\
    \ 0%, transparent 50%),\n                radial-gradient(circle at 80% 20%, rgba(60,\
    \ 180, 220, 0.1) 0%, transparent 50%),\n                repeating-linear-gradient(\n\
    \                    0deg,\n                    transparent,\n               \
