    \ 0.9rem;\n        }\n    </style>\n</head>\n<body>\n    <div class=\"background-pattern\"\
    ></div>\n    <div class=\"container\">\n        <div class=\"lock-icon\">\U0001F6D2\
    </div>\n        <h1>Demo Store</h1>\n        <p class=\"tagline\">Secure e-commerce\
    \ powered by TLS</p>\n        \n        <div class=\"cert-badge\">\n         \
    \   <span class=\"icon\">\U0001F510</span>\n            <div>\n              \
    \  <div class=\"text\">TLS Secured</div>\n                <div class=\"subtext\"\
    >Wildcard Certificate</div>\n            </div>\n        </div>\n        \n  \
    \      <div class=\"info-grid\">\n            <div class=\"info-card\">\n    \
    \            <div class=\"label\">Hostname</div>\n                <div class=\"\
    value\">store.demo.lab</div>\n            </div>\n            <div class=\"info-card\"\
    >\n                <div class=\"label\">Certificate</div>\n                <div\
    \ class=\"value\"><span class=\"wildcard-highlight\">*.demo.lab</span></div>\n\
    \            </div>\n            <div class=\"info-card\">\n                <div\
    \ class=\"label\">Certificate Type</div>\n                <div class=\"value\"\
    >Wildcard (Shared)</div>\n            </div>\n            <div class=\"info-card\"\
    >\n                <div class=\"label\">Issuer</div>\n                <div class=\"\
    value\">Lab CA</div>\n            </div>\n        </div>\n        \n        <div\
    \ class=\"footer\">\n            <p>\U0001F6E1\uFE0F Secured by cert-manager with\
    \ automated certificate lifecycle management</p>\n            <p style=\"margin-top:\
    \ 10px;\">Shares certificate with <strong>blog.demo.lab</strong></p>\n       \
    \ </div>\n    </div>\n</body>\n</html>\n"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: store
  namespace: cert-manager-demo
  labels:
    app: store
    app.kubernetes.io/name: store
    app.kubernetes.io/part-of: demo-apps
spec:
  replicas: 2
  selector:
    matchLabels:
      app: store
  template:
    metadata:
      labels:
        app: store
        app.kubernetes.io/name: store
        app.kubernetes.io/part-of: demo-apps
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: bgp-peer
                operator: DoesNotExist
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist
      containers:
      - name: nginx
        image: nginx:alpine
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
        volumeMounts:
        - name: html
          mountPath: /usr/share/nginx/html
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 50m
            memory: 32Mi
      volumes:
      - name: html
        configMap:
          name: store-html
---
apiVersion: v1
kind: Service
metadata:
  name: store
  namespace: cert-manager-demo
spec:
  selector:
    app: store
  ports:
  - port: 80
    targetPort: 80
