---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-ppt
  namespace: default
  labels:
    app: nginx-ppt
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx-ppt
  template:
    metadata:
      labels:
        app: nginx-ppt
    spec:
      containers:
        - name: nginx
          image: calico-bgp-presentation:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-ppt
  namespace: default
  labels:
    app: nginx-ppt
spec:
  selector:
    app: nginx-ppt
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
  type: LoadBalancer
