---
apiVersion: v1
kind: Pod
metadata:
  name: sender-no-dscp
  labels:
    app: sender
    dscp: none
spec:
  nodeName: k01-worker
  containers:
  - name: netshoot
    image: nicolaka/netshoot:latest
    imagePullPolicy: IfNotPresent
    command:
    - sleep
    - infinity
---
